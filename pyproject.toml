[project]
name = "queryview"
dynamic = ["version"]
description = "QueryView: FastAPI + SQLModel backend and React SPA over the ClickHouse HTTP interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlmodel>=0.0.16",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
    "cryptography>=42",
    "aiosqlite>=0.22.1",
    "alembic>=1.13",
    "mcp>=1.9,<2",
    "asyncpg>=0.29",
    "duckdb>=1.0",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/kolodkin/queryview"
Repository = "https://github.com/kolodkin/queryview"
Issues = "https://github.com/kolodkin/queryview/issues"

[project.scripts]
queryview = "queryview.main:run"
queryview-backend = "queryview.main:run"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-playwright>=0.7",
    "pytest-html>=4.1",
]
dev = [
    { include-group = "test" },
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["e2e"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["backend/queryview"]

# Vite SPA build output. The directory is gitignored and produced by
# `npm run build` — release CI copies frontend/dist there before `uv build`
# so the wheel ships a working /api + SPA out of the box.
[tool.hatch.build]
artifacts = ["backend/queryview/static/**"]
