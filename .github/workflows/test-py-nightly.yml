name: test-py-nightly

# Nightly backend tests at both ends of the supported Python range
# (https://devguide.python.org/versions/). PR CI runs only the 3.11 minimum.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install backend + test dependencies
        run: uv sync --frozen --group test

      - name: Run backend unit tests
        run: uv run --frozen pytest backend/queryview
