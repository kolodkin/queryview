name: CI

on:
  workflow_dispatch:
  pull_request:
  # Runs on main seed the caches (uv, npm, Playwright) a fresh PR branch inherits.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs supersede each other: a cancelled main run saves no caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_RUNNER_NODE_VERSION: node24

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pre-commit's pyright hook resolves imports from the project's .venv
      # (see pyrightconfig.json), so sync it first.
      - name: Install backend + test dependencies
        run: uv sync --frozen --group test

      # Node runtime for the prettier pre-commit hook and vitest.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      # Restoring node_modules whole beats npm ci re-extracting it every run.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run frontend unit tests
        run: npm test -w frontend

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The supported minimum; test-py-nightly.yml also covers the newest.
          python-version: "3.11"

      - name: Install backend + test dependencies
        run: uv sync --frozen --group test

      - name: Run backend unit tests
        run: uv run --frozen pytest backend/queryview

  # The suite runs in two halves on two runners; test-e2e merges their
  # reports and carries the result.
  test-e2e-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24
        ports:
          - 8123:8123
        # Probe the HTTP interface (8123) — what the backend actually uses —
        # so the readiness gate matches the app.
        options: >-
          --health-cmd "wget --spider -q localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --add-host=host.docker.internal:host-gateway
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend
        run: uv sync --frozen

      # Restoring node_modules whole beats npm ci re-extracting it every run.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get Playwright version
        id: pw
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build:e2e -w frontend

      - name: Start git daemon
        uses: ./.github/actions/start-git-daemon

      # The suite starts a backend per worker (built SPA, throwaway DATA_DIR);
      # see e2e/fixtures.ts.
      - name: Run Playwright e2e tests
        run: npx playwright test --workers 4 --shard ${{ matrix.shard }}/2 --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload trace artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore

  test-e2e:
    needs: test-e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: CICD
    permissions:
      contents: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into the HTML report
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Check if report exists
        id: check-report
        if: always()
        run: |
          if [ -f "report/index.html" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "E2E report is present"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "E2E report missing"
          fi

      - name: Deploy E2E Report
        if: always() && steps.check-report.outputs.exists == 'true'
        # Publishing to the external artifact-view repo needs DEPLOY_KEY; don't
        # fail the PR check when that publish can't run — the step still surfaces
        # the error as a warning annotation.
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: kolodkin/artifact-view
          publish_dir: ./report
          destination_dir: queryview-/e2e-report/${{ github.run_number }}
          publish_branch: gh-pages
          keep_files: true

      - name: Create E2E Report check
        if: always()
        uses: LouisBrunner/checks-action@v2.0.0
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/artifact-view/queryview-/e2e-report/${{ github.run_number }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: E2E Report
          conclusion: ${{ needs.test-e2e-shard.result }}
          details_url: ${{ env.REPORT_URL }}
          output: |
            {"title":"${{ needs.test-e2e-shard.result == 'success' && 'Tests passed' || 'Tests failed' }}","summary":"**[View Full E2E Report](${{ env.REPORT_URL }})**"}

      # This job is the e2e check, so it fails when either half did.
      - name: Fail if a shard failed
        if: needs.test-e2e-shard.result != 'success'
        run: exit 1
