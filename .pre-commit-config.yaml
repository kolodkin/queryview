repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '\.json$'
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.400
    hooks:
      - id: pyright

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: prettier --write --ignore-unknown
        files: ^frontend/src/
        additional_dependencies: [prettier@3.9.10]
